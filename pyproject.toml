[project]
name = "josaa-rank-predictor"
version = "0.1.0"
description = "JOSAA Rank Predictor using ML"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "dagshub>=0.6.9",
    "datasets>=4.8.4",
    "dvc",
    "html5lib>=1.1",
    "lightgbm>=4.6.0",
    "lxml>=6.0.2",
    "matplotlib>=3.10.8",
    "mlflow>=1.27.0",
    "opendatasets>=0.1.22",
    "openpyxl>=3.1.5",
    "optuna>=4.8.0",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "selenium>=4.41.0",
    "vconsoleprint>=1.0.2",
    "xgboost>=3.2.0",
]

[tool.setuptools]
packages = ["logger", "exception", "constants", "utils", "josaScrapper"]
package-dir = {"" = ".", "josaScrapper" = "src/josaScrapper"}

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
