[project]
name = "josaa-rank-predictor"
version = "0.1.0"
description = "JOSAA Rank Predictor using ML"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "dvc",
    "html5lib>=1.1",
    "lxml>=6.0.2",
    "matplotlib>=3.10.8",
    "opendatasets>=0.1.22",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "seaborn>=0.13.2",
    "selenium>=4.41.0",
]

[tool.setuptools]
packages = ["logger", "exception", "constants", "utils", "josaScrapper"]
package-dir = {"" = ".", "josaScrapper" = "src/josaScrapper"}

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
